name: CI

# Lightweight gate: core JUnit tests + renderer/electron typecheck. Deliberately skips the heavy
# packaging steps (fetch:obs downloads hundreds of MB, build:all + electron-builder produce the NSIS
# installer) -- those are not needed to catch boot-wiring or type regressions.
on:
  push:
  pull_request:

jobs:
  build:
    # The app is Windows-only (the gradlew wrapper, AppPaths and OBS layout all assume Windows paths).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        working-directory: core
        run: ./gradlew test

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The electron typecheck (tsc -p app/tsconfig.electron.json) resolves the `electron` types from
      # the ROOT node_modules -- electron is a root devDependency, not an app/ one -- so install both.
      - name: Install root deps
        run: npm ci

      - name: Install renderer deps
        run: npm --prefix app ci

      # eslint + its plugins are ROOT devDeps (see eslint.config.mjs), so this must run
      # after `npm ci` at the root. `lint` is `eslint . --max-warnings 0` — warnings fail CI.
      - name: Lint
        run: npm run lint

      - name: Renderer + Electron typecheck
        run: npm --prefix app run typecheck

      - name: App unit tests (electron supervisors)
        run: npm --prefix app run test

      # Guards the packaging config (electron-builder.yml layout + asarUnpack) without running the
      # heavy electron-builder packaging, so a regression like the PR #22 flat `to: obs` or a koffi
      # asarUnpack that misses @koromix fails here rather than at release time. Runs after the app
      # deps install so it can cross-check the installed koffi layout.
      - name: Packaging config check
        run: node scripts/check-packaging-config.mjs
